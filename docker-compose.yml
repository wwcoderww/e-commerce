services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: BEstore
    restart: always
    networks:
      - shared_postgres_network
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres_db:5432/store_db?schema=public
      BACKEND_URL: https://api2.ezwezz.com
      PORT: 8080
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: FEstore
    restart: always
    networks:
      - shared_postgres_network
    environment:
      NEXT_PUBLIC_BACKEND_URL: https://api2.ezwezz.com
      BETTER_AUTH_SECRET: fbe86ff14062be4f92559c07a3608fcf33fedeb40bb3fb517ee565a010743c73

networks:
  shared_postgres_network:
    external: true
