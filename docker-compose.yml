services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      NEXT_BACKEND_URL: https://api.ezwezz.com
      BETTER_AUTH_SECRET: fbe86ff14062be4f92559c07a3608fcf33fedeb40bb3fb517ee565a010743c73

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
