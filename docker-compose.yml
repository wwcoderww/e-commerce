services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wwcoderww/e-commerce-backend:latest}
    container_name: BEstore
    restart: always
    networks:
      - shared_postgres_network
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BACKEND_URL: https://api2.ezwezz.com
      FRONTEND_URL: https://store.ezwezz.com
      PORT: 8080
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wwcoderww/e-commerce-frontend:latest}
    container_name: FEstore
    restart: always
    networks:
      - shared_postgres_network

networks:
  shared_postgres_network:
    external: true
